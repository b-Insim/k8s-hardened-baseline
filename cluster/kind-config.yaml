# -----------------------------------------------------------------------------
# Project: k8s-hardened-baseline
# Purpose: Kubernetes cluster used to demonstrate CKS hardening practices.
# Components:
# - Kind
# - Calico
# - CIS Benchmark validation (kube-bench)
# - RBAC least privilege
# - Network Policies
# - Pod Security Standards (Restricted)
# -----------------------------------------------------------------------------

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

# Disable Kind's default CNI.
# Calico will be installed after cluster creation
# to provide full NetworkPolicy support.
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"   # Pod CIDR expected by the default Calico configuration.

nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        audit-log-path: "/var/log/kubernetes/audit.log"
        audit-log-maxage: "30"
        audit-log-maxbackup: "10"
        audit-log-maxsize: "100"

- role: worker

- role: worker